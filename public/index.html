<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="تنزيل الوسائط من رابط عام">
  <title>تنزيل</title>
  <style>
    :root{color-scheme:dark;background:#000}
    *{box-sizing:border-box}
    html,body{width:100%;min-width:320px;min-height:100%;margin:0;background:#000}
    body{display:grid;place-items:center;min-height:100vh;padding:20px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .bar{display:flex;width:min(820px,100%);height:58px;padding:5px;background:#fff;border-radius:9px;box-shadow:0 12px 36px rgba(255,255,255,.08)}
    input{min-width:0;flex:1;padding:0 15px;border:0;outline:0;background:#fff;color:#000;font:15px system-ui;text-align:left;direction:ltr}
    input::placeholder{color:#777}
    select{height:100%;padding:0 9px;border:0;border-right:1px solid #ddd;outline:0;background:#fff;color:#000;font:13px system-ui;cursor:pointer}
    button,.download{display:inline-flex;align-items:center;justify-content:center;min-width:112px;padding:0 18px;border:0;border-radius:6px;background:#000;color:#fff;font:14px system-ui;cursor:pointer;text-decoration:none}
    button:disabled{opacity:.55;cursor:wait}
    .download{width:100%;font-size:15px}
    .bar[data-state="error"]{outline:2px solid #d33}
    .bar[data-state="loading"] button{cursor:wait}
    @media(max-width:560px){body{padding:12px}.bar{height:54px}.bar button,.bar .download{min-width:70px;padding:0 8px;font-size:13px}input{padding:0 8px;font-size:13px}select{max-width:76px;padding:0 4px;font-size:11px}}
  </style>
</head>
<body>
  <form class="bar" id="bar" autocomplete="off" novalidate>
    <input id="url" name="url" type="url" inputmode="url" dir="ltr" placeholder="ألصق الرابط" aria-label="الرابط" required>
    <select id="format" aria-label="الصيغة"><option value="video">فيديو</option><option value="audio">صوت MP3</option></select>
    <button id="submit" type="submit">تنزيل</button>
  </form>
  <script>
    const bar=document.querySelector('#bar');
    const input=document.querySelector('#url');
    const format=document.querySelector('#format');
    const submit=document.querySelector('#submit');
    let parsedYoutube={url:'',formats:[]};
    const youtube=/^(?:www\.|m\.|music\.)?(?:youtube\.com|youtu\.be|youtube-nocookie\.com)$/i;
    const isYoutube=value=>{try{return youtube.test(new URL(value).hostname)}catch{return false}};
    const normalizeYoutube=value=>{
      const url=new URL(value);const host=url.hostname.toLowerCase();
      if(host==='youtu.be'){const id=url.pathname.split('/').filter(Boolean)[0];return id?'https://www.youtube.com/watch?v='+encodeURIComponent(id):value}
      if(/youtube(?:-nocookie)?\.com$/i.test(host)){
        const match=url.pathname.match(/^\/(?:shorts|embed|live)\/([^/?]+)/i);
        if(match)return 'https://www.youtube.com/watch?v='+encodeURIComponent(match[1]);
        const id=url.searchParams.get('v');
        if(id)return 'https://www.youtube.com/watch?v='+encodeURIComponent(id);
      }
      return value;
    };
    const setState=(state,text)=>{bar.dataset.state=state;submit.textContent=text;submit.disabled=state==='loading'};
    const showLink=(href)=>{bar.replaceChildren();const link=document.createElement('a');link.className='download';link.href=href;link.textContent='تنزيل';link.setAttribute('download','');bar.append(link)};
    const resetFormats=()=>{
      parsedYoutube={url:'',formats:[]};
      format.replaceChildren(new Option('فيديو','video'),new Option('صوت MP3','audio'));
    };
    input.addEventListener('input',()=>{if(parsedYoutube.url&&input.value.trim()!==parsedYoutube.url)resetFormats()});
    const formatLabel=f=>{
      const kind=f.kind==='audio'?'صوت':(f.kind==='progressive'?'فيديو+صوت':'فيديو');
      const quality=f.qualityLabel||f.quality||'';
      const mime=(f.mimeType||'').split(';')[0].split('/')[1]||'';
      const bitrate=f.bitrate?Math.round(Number(f.bitrate)/1000)+'k':'';
      return [kind,quality,mime,bitrate].filter(Boolean).join(' · ');
    };
    const loadYoutubeFormats=async normalized=>{
      const id=normalized.match(/[?&]v=([^&]+)/)?.[1];
      if(!id)throw new Error('رابط YouTube غير صالح');
      const response=await fetch('https://api.vidsnap.app/parse?id='+encodeURIComponent(id),{headers:{Accept:'application/json'}});
      const data=await response.json().catch(()=>({}));
      const formats=Array.isArray(data.formats)?data.formats.filter(f=>f&&f.url):[];
      if(!response.ok||!formats.length)throw new Error(data.error||'تعذر جلب صيغ YouTube');
      format.replaceChildren(...formats.map((f,i)=>new Option(formatLabel(f),String(i))));
      parsedYoutube={url:normalized,formats};
    };
    bar.addEventListener('submit',async event=>{
      event.preventDefault();
      const value=input.value.trim();
      if(!value){input.focus();return}
      if(isYoutube(value)){
        setState('loading','…');
        try{
          const normalized=normalizeYoutube(value);
          if(parsedYoutube.url!==normalized||!parsedYoutube.formats.length){
            await loadYoutubeFormats(normalized);
            setState('idle','اختيار');
            return;
          }
          const selected=parsedYoutube.formats[Number(format.value)];
          if(!selected?.url)throw new Error('اختر صيغة صحيحة');
          showLink('https://api.vidsnap.app/proxy?u='+encodeURIComponent(selected.url));
        }catch{setState('error','إعادة');setTimeout(()=>setState('idle','تنزيل'),1800)}
        return;
      }
      setState('loading','…');
      try{
        const response=await fetch('/api/v1/resolve?url='+encodeURIComponent(value),{headers:{Accept:'application/json'}});
        const data=await response.json().catch(()=>({}));
        if(!response.ok||!data.ok)throw new Error(data.error?.message||'error');
        showLink(data.download);
      }catch{setState('error','إعادة');setTimeout(()=>setState('idle','تنزيل'),1800)}
    });
  </script>
</body>
</html>
