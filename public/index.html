<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="ألصق رابط الفيديو واختر الجودة ثم نزّله">
  <title>نزّل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
  <style>
    :root{
      --paper:#fff; --ink:#000; --soft:#666; --line:#dcdcdc; --wash:#f2f2f2; --err:#c4170c;
      --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
      --r:14px;
    }
    @media (prefers-color-scheme:dark){
      :root{--paper:#000; --ink:#fff; --soft:#9b9b9b; --line:#2b2b2b; --wash:#151515; --err:#ff6b5e}
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;background:var(--paper)}
    body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:stretch;
      background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;
      padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    button,input{font:inherit;color:inherit}
    .ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
    .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    /* ---------- the bar ---------- */
    main{width:100%;max-width:560px;margin:0 auto;padding-bottom:10vh;min-width:0}
    .bar{display:grid;grid-template-columns:minmax(0,1fr);border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;
      transition:border-color .15s}
    .bar[data-state="error"]{border-color:var(--err)}
    .field{display:flex;align-items:center;gap:2px;min-width:0;height:60px;padding-inline:4px 8px}
    .field:focus-within{box-shadow:inset 0 -3px 0 var(--ink)}
    input{flex:1;min-width:0;height:100%;padding:0 8px;border:0;outline:0;background:transparent;
      direction:ltr;text-align:left;font-size:16px;text-overflow:ellipsis}
    input:placeholder-shown{direction:rtl;text-align:right}
    input::placeholder{color:var(--soft);opacity:1}
    input:focus-visible{outline:0}
    .icon-btn{display:grid;place-items:center;flex:none;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--soft);cursor:pointer}
    .icon-btn:hover,.icon-btn:active{background:var(--wash);color:var(--ink)}
    .go{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 24px;border:0;border-top:2px solid var(--ink);
      background:var(--ink);color:var(--paper);font-weight:600;font-size:17px;cursor:pointer}
    .go:active{opacity:.85}
    .go:disabled{cursor:progress}
    .dots{display:inline-flex;gap:5px}
    .dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
    .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
    @media (min-width:560px){
      .bar{grid-template-columns:minmax(0,1fr) auto}
      .field{height:64px}
      .go{height:auto;min-width:150px;border-top:0;border-inline-end:2px solid var(--ink)}
    }

    /* ---------- sheet (formats / progress / result / error) ---------- */
    dialog{width:100%;max-width:560px;max-height:100dvh;margin:auto auto 0;padding:0;border:0;background:transparent;color:var(--ink);overflow:visible}
    dialog::backdrop{background:rgba(0,0,0,.5)}
    dialog[open] .sheet{animation:up .24s cubic-bezier(.2,.8,.2,1) both}
    .sheet{max-height:88dvh;overflow:auto;overscroll-behavior:contain;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
      background:var(--paper);border:2px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0}
    @media (min-width:560px){
      dialog{margin:auto}
      .sheet{border-bottom:2px solid var(--ink);border-radius:22px;padding-bottom:18px}
    }
    .head{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:6px}
    .head>.ic{width:26px;height:26px}
    .head h2{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .list{display:grid;margin:0;padding:0;list-style:none}
    .list+.list{margin-top:8px;border-top:2px solid var(--ink)}
    .item{display:flex;align-items:center;border-bottom:1px solid var(--line)}
    .item:last-child{border-bottom:0}
    .row{flex:1;min-width:0;display:flex;align-items:center;gap:14px;min-height:58px;padding:8px 4px;border:0;background:transparent;text-align:start;cursor:pointer;border-radius:10px}
    .row:active{background:var(--wash)}
    @media (hover:hover){.row:hover{background:var(--wash)}}
    .row .grow{flex:1;min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 14px}
    .row b{font-size:17px;font-weight:600}
    .row small{display:flex;flex-wrap:wrap;gap:0 12px;color:var(--soft);font-size:13px}
    details summary{display:flex;align-items:center;gap:10px;min-height:48px;margin-top:8px;border-top:2px solid var(--ink);color:var(--soft);cursor:pointer;list-style:none}
    details summary::-webkit-details-marker{display:none}
    details[open] summary{color:var(--ink)}
    details .list{margin:0;border:0}
    .trim{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:0 4px 12px}
    .trim[hidden]{display:none}
    .trim input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
    .trim input{height:46px;padding:0 12px;border:2px solid var(--ink);border-radius:10px;direction:ltr;text-align:center;font-size:16px}
    .trim input:placeholder-shown{direction:ltr;text-align:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border:2px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--paper);font-weight:600;font-size:16px;cursor:pointer}
    .btn:active{opacity:.85}
    .btn.block{width:100%;margin-top:14px}
    .btn.ghost{background:transparent;color:var(--ink)}
    .btn.sm{min-height:46px;padding:0 16px}
    .stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0;color:var(--soft);font-size:14px}
    .notice{margin:6px 0 0;font-size:15px;line-height:1.7;color:var(--err);overflow-wrap:anywhere}
    .diag{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--soft)}
    .diag li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)}
    .meta{margin:12px 0 0;color:var(--soft);font-size:12px;direction:ltr;text-align:start;overflow-wrap:anywhere}

    /* ---------- progress ---------- */
    .track{height:8px;margin:14px 0 10px;border-radius:4px;overflow:hidden;background:var(--line)}
    .fill{height:100%;width:0;background:var(--ink);border-radius:4px;transition:width .15s linear}
    .track[data-indeterminate="true"] .fill{width:36%;animation:slide 1.1s ease-in-out infinite}
    .progress-text{display:flex;justify-content:space-between;color:var(--soft);font-size:13px;font-variant-numeric:tabular-nums}

    @keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
    @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
    @keyframes slide{0%{transform:translateX(160%)}100%{transform:translateX(-160%)}}
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19.5h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 4h6v3H9zM7 5.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1h-1"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 9.5v5l4-2.5z"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zM19 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l4 6M21 9l-4 6"/></symbol>
      <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="6.5" r="2.5"/><circle cx="6" cy="17.5" r="2.5"/><path d="M8 8l12 9M8 16l12-9"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 21.5 20h-19zM12 10v4.5M12 17.4v.1"/></symbol>
      <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5"/></symbol>
    </defs>
  </svg>

  <main>
    <h1 class="vh">نزّل</h1>
    <form id="bar" class="bar" autocomplete="off" novalidate>
      <div class="field">
        <button id="paste" class="icon-btn" type="button" aria-label="لصق من الحافظة"><svg class="ic" aria-hidden="true"><use href="#i-paste"/></svg></button>
        <label class="vh" for="url">الرابط</label>
        <input id="url" name="url" type="url" inputmode="url" placeholder="ألصق الرابط هنا" required>
      </div>
      <button id="submit" class="go" type="submit"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg><span id="submit-text">تنزيل</span></button>
    </form>
  </main>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <div class="sheet" id="view" data-tone=""></div>
  </dialog>

  <script>
  (()=>{
    const $=s=>document.querySelector(s);
    const bar=$('#bar'),input=$('#url'),submit=$('#submit'),submitText=$('#submit-text'),pasteBtn=$('#paste'),dlg=$('#dlg'),view=$('#view');
    const MAX_BLOB=150*1024*1024;
    let currentDownload=null,lastAction=null,doneTimer=0;

    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const ic=name=>`<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const ar=n=>new Intl.NumberFormat('ar-EG').format(n);
    const bytes=n=>{if(!n)return'';const u=['بايت','ك.ب','م.ب','ج.ب'];let i=0,v=n;while(v>=1024&&i<3){v/=1024;i++}return ar(+v.toFixed(i>1?1:0))+' '+u[i]};
    const clock=s=>{if(!s)return'';const m=Math.floor(s/60),r=Math.round(s%60);return ar(m)+':'+ar(r).padStart(2,'٠')};

    const youtubeHost=/^(?:www\.|m\.|music\.)?(?:youtube\.com|youtu\.be|youtube-nocookie\.com)$/i;
    const isYoutube=v=>{try{return youtubeHost.test(new URL(v).hostname)}catch{return false}};
    const findUrl=raw=>{const m=String(raw).match(/https?:\/\/[^\s<>"']+/i);return m?m[0].replace(/[.,;)!?]+$/,''):String(raw).trim()};

    const REASONS={timeout:'انتهت المهلة',unreachable:'تعذر الاتصال',empty:'لم يرجع أي صيغة',bad_response:'ردّ غير مفهوم',error:'خطأ داخلي',not_configured:'غير مفعّل'};
    const reasonText=r=>REASONS[r]||(/^http_(\d+)/.test(r)?'أعاد الخطأ '+r.slice(5):r);

    class Fail extends Error{constructor(o){super(o.message);Object.assign(this,o)}}
    const failFrom=(response,data)=>{
      const e=(data&&data.error)||{};
      return new Fail({code:e.code||'http_'+response.status,message:e.message||'تعذر إكمال الطلب.',status:response.status,
        retryable:e.retryable??response.status>=500,details:e.details,requestId:(data&&data.request_id)||response.headers.get('x-request-id')||'',
        retryAfter:Number(response.headers.get('retry-after'))||0});
    };
    const networkFail=err=>new Fail({code:err&&err.name==='AbortError'?'client_timeout':'network',status:0,retryable:true,
      message:err&&err.name==='AbortError'?'استغرق الخادم وقتًا أطول من المسموح.':'تعذر الاتصال بالخادم؛ تحقق من الإنترنت.'});

    const getJson=async(url,ms=14000)=>{
      const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),ms);
      try{
        let response;
        try{response=await fetch(url,{headers:{Accept:'application/json'},signal:ctl.signal})}catch(err){throw networkFail(err)}
        const data=await response.json().catch(()=>null);
        if(!response.ok||!data||data.ok===false)throw failFrom(response,data);
        return data;
      }finally{clearTimeout(timer)}
    };
    /* one automatic retry for transient provider failures (502/503/504) */
    const getJsonRetry=async url=>{
      const t0=Date.now();
      try{return await getJson(url)}
      catch(err){
        if(!(err instanceof Fail)||!err.retryable||![502,503,504].includes(err.status)||Date.now()-t0>7000)throw err;
        await new Promise(r=>setTimeout(r,Math.min(Math.max(err.retryAfter,1),3)*1000));
        return getJson(url+(url.includes('?')?'&':'?')+'fresh=1');
      }
    };

    /* ---------- sheet ---------- */
    const head=(title,icon)=>`<div class="head">${icon?ic(icon):''}<h2 id="dlg-title">${esc(title)}</h2><button class="icon-btn" type="button" data-close aria-label="إغلاق">${ic('close')}</button></div>`;
    const open=(html,tone='')=>{clearTimeout(doneTimer);view.dataset.tone=tone;view.innerHTML=html;if(!dlg.open)dlg.showModal();
      const first=view.querySelector('[data-autofocus]');first&&first.focus({preventScroll:true})};
    const abortCurrent=()=>{if(currentDownload){currentDownload.abort();currentDownload=null}};
    const closeAll=()=>{clearTimeout(doneTimer);abortCurrent();if(dlg.open)dlg.close()};
    dlg.addEventListener('click',e=>{if(e.target===dlg)closeAll()});
    dlg.addEventListener('cancel',()=>{clearTimeout(doneTimer);abortCurrent()});
    view.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeAll()});

    const setBusy=(busy,label)=>{
      submit.disabled=busy;bar.dataset.state=busy?'loading':'idle';
      submitText.innerHTML=busy?`<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="vh">${esc(label||'جارٍ الجلب')}</span>`:'تنزيل';
    };

    const formatRow=f=>{
      const audio=f.kind==='audio',mute=f.kind==='video';
      const type=(f.mimeType||'').split('/')[1]||'';
      const hasQ=f.quality&&f.quality!=='—'&&f.quality!=='صوت';
      const level={low:'منخفضة',medium:'متوسطة',high:'عالية',tiny:'منخفضة جدًا'};
      const q=level[String(f.quality).toLowerCase()]||f.quality;
      const label=audio?(hasQ?q:'صوت'):(hasQ?q:'فيديو');
      const meta=[type?`<span dir="ltr">${esc(type)}</span>`:'',f.size?`<span>${bytes(f.size)}</span>`:'',f.bitrate?`<span dir="ltr">${Math.round(f.bitrate/1000)}k</span>`:''].filter(Boolean).join('');
      return `<li><div class="item"><button class="row" type="button" data-href="${esc(f.download_url)}" data-name="${esc(f.__name)}">${ic(audio?'music':mute?'mute':'play')}`+
        `<span class="grow"><b>${esc(label)}</b><small>${meta}</small></span>${ic('download')}</button>`+
        `${audio?`<button class="icon-btn" type="button" data-cut aria-label="اقتصاص" aria-expanded="false">${ic('cut')}</button>`:''}</div>`+
        `${audio?`<div class="trim" hidden><input type="text" inputmode="numeric" placeholder="من 0:30" aria-label="من" data-start><input type="text" inputmode="numeric" placeholder="إلى 1:00" aria-label="إلى" data-end><button class="btn sm" type="button" data-trim="${esc(f.download_url)}" data-title="${esc(f.__name)}">${ic('check')}</button></div>`:''}</li>`;
    };
    const showFormats=data=>{
      const named=data.formats.map(f=>({...f,__name:data.title}));
      const by=k=>named.filter(f=>f.kind===k);
      const list=items=>items.length?`<ul class="list">${items.map(formatRow).join('')}</ul>`:'';
      const mute=by('video');
      open(head(data.title||'')+list(by('progressive'))+list(by('audio'))+
        (mute.length?`<details><summary>${ic('mute')}<span>${ar(mute.length)}</span></summary><ul class="list">${mute.map(formatRow).join('')}</ul></details>`:''));
      view.querySelectorAll('.row').forEach(b=>b.addEventListener('click',()=>startDownload(b.dataset.href,b.dataset.name)));
      view.querySelectorAll('[data-cut]').forEach(btn=>btn.addEventListener('click',()=>{
        const panel=btn.closest('li').querySelector('.trim'),show=panel.hidden;
        panel.hidden=!show;btn.setAttribute('aria-expanded',show);
        if(show)panel.querySelector('[data-start]').focus({preventScroll:true});
      }));
      view.querySelectorAll('[data-trim]').forEach(btn=>btn.addEventListener('click',()=>{
        const panel=btn.closest('.trim');
        const start=panel.querySelector('[data-start]').value.trim(),end=panel.querySelector('[data-end]').value.trim();
        const qs=[];if(start)qs.push('start='+encodeURIComponent(start));if(end)qs.push('end='+encodeURIComponent(end));
        if(!qs.length){panel.querySelector('[data-start]').focus();return}
        startDownload(btn.dataset.trim.replace('/youtube/download?','/youtube/trim?')+'&'+qs.join('&'),(btn.dataset.title||'audio')+' [مقتطع]');
      }));
    };
    const showResult=data=>{
      const stats=[data.size?bytes(data.size):'',data.duration?clock(data.duration):'',data.ext?`<span dir="ltr">${esc(data.ext)}</span>`:''].filter(Boolean);
      open(head(data.title||'الملف جاهز','file')+(stats.length?`<p class="stats">${stats.map(s=>`<span>${s}</span>`).join('')}</p>`:'')+
        `<button class="btn block" type="button" id="go-download" data-autofocus>${ic('download')}تنزيل</button>`);
      $('#go-download').addEventListener('click',()=>startDownload(data.download,data.title||'download'));
    };
    const showError=(err,retry)=>{
      const providers=err.details&&Array.isArray(err.details.providers)?err.details.providers:null;
      const outage=providers?`<ul class="diag">${providers.map(p=>`<li><span dir="ltr">${esc(p.provider)}</span><span>${esc(reasonText(p.reason))}</span></li>`).join('')}</ul>`:'';
      open(head('تعذر إكمال العملية','warn')+
        `<p class="notice" role="alert">${esc(err.message)}</p>${outage}`+
        (err.retryable&&retry?`<button class="btn block" type="button" id="retry" data-autofocus>${ic('retry')}إعادة المحاولة</button>`:'')+
        `<p class="meta">${esc(err.code)}${err.status?' / HTTP '+err.status:''}${err.requestId?' / '+esc(err.requestId):''}</p>`,'error');
      const r=$('#retry');r&&r.addEventListener('click',retry);
    };
    const showProgress=name=>{
      open(head(name,'download')+
        `<div class="track" data-indeterminate="true" id="track"><div class="fill" id="fill"></div></div><div class="progress-text"><span id="ptext">…</span><span id="ppct"></span></div>`);
    };
    const showDone=(name,note)=>{
      open(head(note||name,'check'),'ok');
      doneTimer=setTimeout(()=>{if(dlg.open)dlg.close()},2200);
    };

    /* ---------- download with progress ---------- */
    const nameFrom=(cd,fallback)=>{
      if(!cd)return fallback;
      const star=cd.match(/filename\*=UTF-8''([^;]+)/i);
      if(star){try{return decodeURIComponent(star[1])}catch{}}
      const plain=cd.match(/filename="?([^";]+)"?/i);return plain?plain[1]:fallback;
    };
    const saveBlob=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),15000)};
    async function startDownload(href,title){
      lastAction=()=>startDownload(href,title);
      const ctl=new AbortController();currentDownload=ctl;showProgress(title);
      try{
        let response;
        try{response=await fetch(href,{signal:ctl.signal})}catch(err){if(err.name==='AbortError')return;throw networkFail(err)}
        if(!response.ok){const data=await response.json().catch(()=>null);throw failFrom(response,data)}
        const total=Number(response.headers.get('content-length'))||0;
        const name=nameFrom(response.headers.get('content-disposition'),title+'.mp4');
        if(total>MAX_BLOB||!response.body){ctl.abort();currentDownload=null;
          const a=document.createElement('a');a.href=href;a.download=name;document.body.append(a);a.click();a.remove();
          showDone(name,'بدأ المتصفح التنزيل');return}
        const track=$('#track'),fill=$('#fill'),ptext=$('#ptext'),ppct=$('#ppct');
        if(total)track.dataset.indeterminate='false';
        const reader=response.body.getReader(),chunks=[];let got=0;
        for(;;){
          const part=await reader.read();if(part.done)break;
          chunks.push(part.value);got+=part.value.length;
          ptext.textContent=bytes(got)+(total?' / '+bytes(total):'');
          if(total){const p=Math.min(100,Math.round(got*100/total));fill.style.width=p+'%';ppct.textContent=ar(p)+'٪'}
        }
        saveBlob(new Blob(chunks,{type:response.headers.get('content-type')||'application/octet-stream'}),name);
        currentDownload=null;showDone(name);
      }catch(err){
        currentDownload=null;
        if(err&&err.name==='AbortError')return;
        showError(err instanceof Fail?err:networkFail(err),()=>lastAction&&lastAction());
      }
    }

    /* ---------- submit flow ---------- */
    async function run(){
      const value=findUrl(input.value);if(!value){input.focus();return}
      lastAction=run;setBusy(true);
      try{
        const data=isYoutube(value)
          ?await getJsonRetry('/api/v1/youtube/formats?url='+encodeURIComponent(value))
          :await getJsonRetry('/api/v1/resolve?url='+encodeURIComponent(value));
        setBusy(false);
        isYoutube(value)?showFormats(data):showResult(data);
      }catch(err){
        setBusy(false);bar.dataset.state='error';
        showError(err instanceof Fail?err:networkFail(err),run);
      }
    }
    bar.addEventListener('submit',e=>{e.preventDefault();run()});
    input.addEventListener('input',()=>{if(bar.dataset.state==='error')bar.dataset.state='idle'});
    dlg.addEventListener('close',()=>{if(bar.dataset.state!=='error')bar.dataset.state='idle'});
    pasteBtn.addEventListener('click',async()=>{
      try{const text=await navigator.clipboard.readText();if(text){input.value=text.trim();input.focus()}}catch{input.focus()}
    });

    const preset=new URLSearchParams(location.search).get('url');
    if(preset){input.value=preset;run()}
    else if(matchMedia('(pointer:fine)').matches){setTimeout(()=>input.focus({preventScroll:true}),300)}
  })();
  </script>
</body>
</html>
